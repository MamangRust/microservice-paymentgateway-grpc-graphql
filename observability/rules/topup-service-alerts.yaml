# Topup service alerts.
# Metrics recorded by shared/observability/tracing_metrics.go, exported by the
# OTel collector under the golang_app namespace with the service_name label.
groups:
  - name: topup-services-alerts
    rules:
      - alert: HighFailureRate_TopupCommandService
        expr: increase(golang_app_requests_total{service_name="topup-service", method=~"CreateTopup|UpdateTopup|TrashedTopup|RestoreTopup|DeleteTopupPermanent|RestoreAllTopup|DeleteAllTopupPermanent", status="error"}[5m]) > 5
        for: 2m
        labels:
          severity: warning
          service: topup_command_service
        annotations:
          summary: "High failure rate on topup command service"
          description: "More than 5 error requests in the last 5 minutes."

      - alert: HighLatency_TopupCommandService
        expr: histogram_quantile(0.95, rate(golang_app_request_duration_seconds_bucket{service_name="topup-service", method=~"CreateTopup|UpdateTopup|TrashedTopup|RestoreTopup|DeleteTopupPermanent|RestoreAllTopup|DeleteAllTopupPermanent"}[5m])) > 1
        for: 2m
        labels:
          severity: warning
          service: topup_command_service
        annotations:
          summary: "High latency on topup command service"
          description: "P95 latency is greater than 1 second."

      - alert: NoTraffic_TopupCommandService
        expr: rate(golang_app_requests_total{service_name="topup-service", method=~"CreateTopup|UpdateTopup|TrashedTopup|RestoreTopup|DeleteTopupPermanent|RestoreAllTopup|DeleteAllTopupPermanent"}[5m]) == 0
        for: 2m
        labels:
          severity: warning
          service: topup_command_service
        annotations:
          summary: "No traffic on topup command service"
          description: "No requests received in the last 5 minutes."

      - alert: HighFailureRate_TopupQueryService
        expr: increase(golang_app_requests_total{service_name="topup-service", method=~"Find.*", status="error"}[5m]) > 5
        for: 2m
        labels:
          severity: warning
          service: topup_query_service
        annotations:
          summary: "High failure rate on topup query service"
          description: "More than 5 error requests in the last 5 minutes."

      - alert: HighLatency_TopupQueryService
        expr: histogram_quantile(0.95, rate(golang_app_request_duration_seconds_bucket{service_name="topup-service", method=~"Find.*"}[5m])) > 1
        for: 2m
        labels:
          severity: warning
          service: topup_query_service
        annotations:
          summary: "High latency on topup query service"
          description: "P95 latency is greater than 1 second."

      - alert: NoTraffic_TopupQueryService
        expr: rate(golang_app_requests_total{service_name="topup-service", method=~"Find.*"}[5m]) == 0
        for: 2m
        labels:
          severity: warning
          service: topup_query_service
        annotations:
          summary: "No traffic on topup query service"
          description: "No requests received in the last 5 minutes."
