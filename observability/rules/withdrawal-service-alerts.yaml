# Withdraw service alerts.
# Metrics recorded by shared/observability/tracing_metrics.go, exported by the
# OTel collector under the golang_app namespace with the service_name label.
groups:
  - name: withdraw-services-alerts
    rules:
      - alert: HighFailureRate_WithdrawCommandService
        expr: increase(golang_app_requests_total{service_name="withdraw-service", method=~"CreateWithdraw|UpdateWithdraw|TrashedWithdraw|RestoreWithdraw|DeleteWithdrawPermanent|RestoreAllWithdraw|DeleteAllWithdrawPermanent", status="error"}[5m]) > 5
        for: 2m
        labels:
          severity: warning
          service: withdraw_command_service
        annotations:
          summary: "High failure rate on withdraw command service"
          description: "More than 5 error requests in the last 5 minutes."

      - alert: HighLatency_WithdrawCommandService
        expr: histogram_quantile(0.95, rate(golang_app_request_duration_seconds_bucket{service_name="withdraw-service", method=~"CreateWithdraw|UpdateWithdraw|TrashedWithdraw|RestoreWithdraw|DeleteWithdrawPermanent|RestoreAllWithdraw|DeleteAllWithdrawPermanent"}[5m])) > 1
        for: 2m
        labels:
          severity: warning
          service: withdraw_command_service
        annotations:
          summary: "High latency on withdraw command service"
          description: "P95 latency is greater than 1 second."

      - alert: NoTraffic_WithdrawCommandService
        expr: rate(golang_app_requests_total{service_name="withdraw-service", method=~"CreateWithdraw|UpdateWithdraw|TrashedWithdraw|RestoreWithdraw|DeleteWithdrawPermanent|RestoreAllWithdraw|DeleteAllWithdrawPermanent"}[5m]) == 0
        for: 2m
        labels:
          severity: warning
          service: withdraw_command_service
        annotations:
          summary: "No traffic on withdraw command service"
          description: "No requests received in the last 5 minutes."

      - alert: HighFailureRate_WithdrawQueryService
        expr: increase(golang_app_requests_total{service_name="withdraw-service", method=~"Find.*", status="error"}[5m]) > 5
        for: 2m
        labels:
          severity: warning
          service: withdraw_query_service
        annotations:
          summary: "High failure rate on withdraw query service"
          description: "More than 5 error requests in the last 5 minutes."

      - alert: HighLatency_WithdrawQueryService
        expr: histogram_quantile(0.95, rate(golang_app_request_duration_seconds_bucket{service_name="withdraw-service", method=~"Find.*"}[5m])) > 1
        for: 2m
        labels:
          severity: warning
          service: withdraw_query_service
        annotations:
          summary: "High latency on withdraw query service"
          description: "P95 latency is greater than 1 second."

      - alert: NoTraffic_WithdrawQueryService
        expr: rate(golang_app_requests_total{service_name="withdraw-service", method=~"Find.*"}[5m]) == 0
        for: 2m
        labels:
          severity: warning
          service: withdraw_query_service
        annotations:
          summary: "No traffic on withdraw query service"
          description: "No requests received in the last 5 minutes."
