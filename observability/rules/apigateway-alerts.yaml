# API Gateway alerts.
# The gateway records every HTTP request through shared/observability with the
# service_name label "apigateway-service" and the route method (e.g. "login",
# "create-topup", "find-all-transfers") as the method label, exported by the
# OTel collector under the golang_app namespace.
groups:
  - name: apigateway-alerts
    rules:
      - alert: AuthHighErrorRate
        expr: |
          sum(rate(golang_app_requests_total{service_name="apigateway-service", method=~"login|register|GetMe|refresh-token", status="error"}[1m]))
          /
          sum(rate(golang_app_requests_total{service_name="apigateway-service", method=~"login|register|GetMe|refresh-token"}[1m])) > 0.1
        for: 2m
        labels:
          service: auth
          severity: critical
        annotations:
          summary: "High error rate on auth endpoints ({{ $value }}%)"
          description: "More than 10% of auth requests are failing."

      - alert: AuthHighLatency
        expr: |
          histogram_quantile(0.95, rate(golang_app_request_duration_seconds_bucket{service_name="apigateway-service", method=~"login|register|GetMe|refresh-token"}[5m])) > 1
        for: 5m
        labels:
          service: auth
          severity: warning
        annotations:
          summary: "Auth endpoints latency is high ({{ $value }}s)"
          description: "95th percentile latency for auth endpoints > 1s."

      - alert: AuthNoTraffic
        expr: |
          rate(golang_app_requests_total{service_name="apigateway-service", method=~"login|register|GetMe|refresh-token"}[5m]) == 0
        for: 5m
        labels:
          service: auth
          severity: warning
        annotations:
          summary: "No traffic on auth endpoints"
          description: "No incoming auth requests for 5 minutes."

