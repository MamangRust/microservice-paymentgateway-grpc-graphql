name: Build and push

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - v*

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Just
        uses: extractions/setup-just@v2

      - name: Validate All Modules
        run: just validate

  generated-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Just
        uses: extractions/setup-just@v2

      # Pin the exact tool versions that produced the committed generated code
      # (see headers in pb/*.pb.go and pkg/database/schema/*.sql.go).
      - name: Install pinned protoc (3.21.12)
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v3.21.12/protoc-3.21.12-linux-x86_64.zip
          unzip -o /tmp/protoc.zip -d /tmp/protoc
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"

      - name: Install pinned protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Install pinned sqlc (1.30.0)
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0

      - name: Check generated code has no drift
        run: just generate-check

  docker:
    needs: [validate, generated-drift]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [apigateway, auth, user, role, card, merchant, saldo, topup, transaction, transfer, withdraw, email, ai-security, stats-reader, stats-writer]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mamangrust/microservice-payment-gateway-grpc/${{ matrix.service }}
          tags: |
            type=ref,event=branch,name=main
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.description=Microservice ${{ matrix.service }} for Payment Gateway
            org.opencontainers.image.source=https://github.com/mamangrust/microservice-payment-gateway-grpc
            org.opencontainers.image.url=https://github.com/mamangrust/microservice-payment-gateway-grpc
            org.opencontainers.image.licenses=MIT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.MY_TOKEN }}

      - name: Debug Build Info
        run: |
          echo "Building service: ${{ matrix.service }}"
          echo "Dockerfile: service/${{ matrix.service }}/Dockerfile"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: ./service/${{ matrix.service }}/Dockerfile
          tags: |
            ${{ steps.meta.outputs.tags }}
            ghcr.io/mamangrust/microservice-payment-gateway-grpc/${{ matrix.service }}:latest
          labels: ${{ steps.meta.outputs.labels }}
