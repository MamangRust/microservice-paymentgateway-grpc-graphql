syntax = "proto3";

option go_package = 'github.com/MamangRust/microservice-payment-gateway-grpc/pb/saldo';

package pb.saldo;

import "common/api.proto";
import "card/card.proto";
import "saldo/saldo.proto";

message ApiResponsePaginationSaldo {
  string status = 1;
  string message = 2;
  repeated SaldoResponse data = 3;
  pb.common.PaginationMeta paginationMeta = 4;
}

message ApiResponsePaginationSaldoDeleteAt {
  string status = 1;
  string message = 2;
  repeated SaldoResponseDeleteAt data = 3;
  pb.common.PaginationMeta paginationMeta = 4;
}

message ReconciliationMismatch {
  int32 saldo_id = 1;
  string card_number = 2;
  int64 current_balance = 3;
  int64 ledger_balance = 4;
  int64 difference = 5;
  int64 ledger_entries = 6;
}

message ReconciliationQueueItem {
  int64 queue_id = 1;
  int32 saldo_id = 2;
  string card_number = 3;
  int64 current_balance = 4;
  int64 ledger_balance = 5;
  int64 difference = 6;
  int64 ledger_entries = 7;
  string status = 8;
  int64 mismatch_count = 9;
  string first_seen_at = 10;
  string last_seen_at = 11;
  string resolved_at = 12;
  string resolution_operation_id = 13;
  string resolution_note = 14;
}

message LedgerEntryResponse {
  int64 entry_id = 1;
  string operation_id = 2;
  string card_number = 3;
  string direction = 4;
  int64 amount = 5;
  int64 delta = 6;
  int64 balance_before = 7;
  int64 balance_after = 8;
  string source_type = 9;
  string source_id = 10;
  string created_at = 11;
}

message ApiResponseReconciliation {
  string status = 1;
  string message = 2;
  repeated ReconciliationQueueItem data = 3;
}

message ApiResponseLedger {
  string status = 1;
  string message = 2;
  repeated LedgerEntryResponse data = 3;
}

message ListReconciliationRequest {
  string status = 1;
  int32 limit = 2;
}

message ListLedgerEntriesRequest {
  string card_number = 1;
  int32 limit = 2;
}

service SaldoQueryService {
  rpc FindAllSaldo(FindAllSaldoRequest) returns (ApiResponsePaginationSaldo) {}
  rpc FindByIdSaldo(FindByIdSaldoRequest) returns (ApiResponseSaldo) {}
  rpc FindByCardNumber(pb.card.FindByCardNumberRequest)
      returns (ApiResponseSaldo) {}
  rpc FindByActive(FindAllSaldoRequest)
      returns (ApiResponsePaginationSaldoDeleteAt) {}
  rpc FindByTrashed(FindAllSaldoRequest)
      returns (ApiResponsePaginationSaldoDeleteAt) {}
  rpc ListReconciliationQueue(ListReconciliationRequest) returns (ApiResponseReconciliation) {}
  rpc ListLedgerEntries(ListLedgerEntriesRequest) returns (ApiResponseLedger) {}
}