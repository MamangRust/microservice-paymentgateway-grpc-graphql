# docker-compose.infra.yml
#
# Infrastructure-only compose file for local e2e testing.
# Go services run on the host via `go run`; this file provides databases,
# message broker, cache, and analytics store inside Docker.
#
# Usage:
#   docker compose -f docker-compose.infra.yml up -d
#   docker compose -f docker-compose.infra.yml --profile monitoring up -d   # + jaeger/otel/prometheus/grafana

name: e2e-infra

services:
  # ─── PostgreSQL databases (one per service) ───────────────────────────
  auth-db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DRAGON -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: user_db
    ports:
      - "5434:5432"
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DRAGON -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  role-db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: role_db
    ports:
      - "5435:5432"
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DRAGON -d role_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  card-db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: card_db
    ports:
      - "5436:5432"
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DRAGON -d card_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  merchant-db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: merchant_db
    ports:
      - "5437:5432"
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DRAGON -d merchant_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  saldo-db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: saldo_db
    ports:
      - "5438:5432"
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DRAGON -d saldo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  topup-db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: topup_db
    ports:
      - "5439:5432"
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DRAGON -d topup_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  transaction-db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: transaction_db
    ports:
      - "5440:5432"
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DRAGON -d transaction_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  transfer-db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: transfer_db
    ports:
      - "5441:5432"
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DRAGON -d transfer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  withdraw-db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: DRAGON
      POSTGRES_PASSWORD: DRAGON
      POSTGRES_DB: withdraw_db
    ports:
      - "5442:5432"
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DRAGON -d withdraw_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis (single node for local dev) ────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: e2e-redis
    command: ["redis-server", "--requirepass", "dragon_knight"]
    ports:
      - "6379:6379"
    networks:
      - e2e
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dragon_knight", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Kafka (single-node KRaft) ────────────────────────────────────────
  kafka:
    image: apache/kafka:latest
    container_name: e2e-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # advertised to localhost so host-run Go services can reconnect
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CLUSTER_ID: kraft-e2e-01
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 10
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_CONTROLLER_QUORUM_ELECTION_TIMEOUT_MS: 5000
      KAFKA_CONTROLLER_QUORUM_REQUEST_TIMEOUT_MS: 3000
      KAFKA_CONTROLLER_QUORUM_RETRY_BACKOFF_MS: 500
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9092 && echo ok' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ─── ClickHouse (analytics / stats) ───────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: e2e-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../../pkg/clickhouse/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks:
      - e2e
    environment:
      CLICKHOUSE_USER: dragon
      CLICKHOUSE_PASSWORD: dragon_knight
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ─── Observability (optional, enable with --profile monitoring) ────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: e2e-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ../../observability/otel-collector.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - e2e
    profiles:
      - monitoring

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: e2e-jaeger
    ports:
      - "16686:16686"
    networks:
      - e2e
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    profiles:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: e2e-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../../observability/prometheus.yaml:/etc/prometheus/prometheus.yml
      - ../../observability/rules:/etc/prometheus/rules
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - e2e
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: e2e-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - e2e
    depends_on:
      - prometheus
      - jaeger
    profiles:
      - monitoring

volumes:
  clickhouse_data:

networks:
  e2e:
    driver: bridge
